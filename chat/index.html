<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DeepSeek Research</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script src="loop-process-display.js?v=loop-fallback-20260830"></script>
<style>
  :root {
    --bg-primary: #0B0B0F;
    --bg-secondary: #14141C;
    --bg-sidebar: #131318;
    --bg-hover: #1B1B28;
    --bg-input: #14141C;
    --text-primary: #F0F1F7;
    --text-secondary: #9A9BA8;
    --text-muted: #5C5D6B;
    --accent: #4D6BFE;
    --accent-hover: #6A83FF;
    --accent-light: rgba(77,107,254,0.16);
    --accent-blue: #4D6BFE;
    --accent-blue-hover: #6A83FF;
    --accent-blue-light: rgba(77,107,254,0.18);
    --border: #23232E;
    --border-light: #1B1B24;
    --code-bg: #08080C;
    --user-bubble: #14141C;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.4);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.45);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.55);
  }

  .light {
    --bg-primary: #FAFAFA;
    --bg-secondary: #F2F3F7;
    --bg-sidebar: #F6F7FA;
    --bg-hover: #EAECF2;
    --bg-input: #F2F3F7;
    --text-primary: #14151A;
    --text-secondary: #5A5C68;
    --text-muted: #9A9CA8;
    --accent: #4D6BFE;
    --accent-hover: #3D59E0;
    --accent-light: rgba(77,107,254,0.10);
    --accent-blue: #4D6BFE;
    --accent-blue-hover: #3D59E0;
    --accent-blue-light: rgba(77,107,254,0.10);
    --border: #E0E1E8;
    --border-light: #ECEDF3;
    --code-bg: #14151A;
    --user-bubble: #F2F3F7;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.05);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    overflow: hidden;
    height: 100vh;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--bg-sidebar);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
    z-index: 30;
  }

  .sidebar.collapsed {
    width: 0;
    min-width: 0;
    overflow: hidden;
    border-right: none;
  }

  .sidebar-header {
    padding: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .sidebar-nav {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  .nav-section-title {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 8px 12px 4px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s ease;
    font-size: 14px;
    color: var(--text-secondary);
    position: relative;
  }

  .nav-item:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  .nav-item.active {
    background: var(--accent-light);
    color: var(--accent);
  }

  .nav-item .delete-btn {
    opacity: 0;
    transition: opacity 0.15s;
    margin-left: auto;
    color: var(--text-muted);
    flex-shrink: 0;
  }

  .nav-item:hover .delete-btn { opacity: 1; }
  .nav-item .delete-btn:hover { color: #ef4444; }

  .nav-item-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 16px;
    border: 1px dashed var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text-secondary);
    font-size: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: inherit;
  }

  .new-chat-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-light);
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: var(--bg-primary);
    z-index: 10;
  }

  .model-selector {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    background: transparent;
    border: none;
    font-family: inherit;
  }

  .model-selector:hover { background: var(--bg-hover); }

  .top-bar-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    font-family: inherit;
  }

  .icon-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  
  .cli-link:hover {
    filter: brightness(1.25);
    text-shadow: 0 0 12px rgba(255, 170, 60, 0.5);
  }

  /* Oroboros Service Mesh Chips */
  .network-chips {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-right: 6px;
    flex-wrap: wrap;
  }

  .svc-chip {
    display: flex;
    align-items: center;
    gap: 3px;
    padding: 2px 6px;
    border-radius: 5px;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    background: var(--bg-hover);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .svc-chip.active {
    color: #22c55e;
    background: rgba(34,197,94,0.1);
    text-shadow: 0 0 6px rgba(34,197,94,0.3);
  }

  .svc-chip .chip-dot {
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #ef4444;
    transition: all 0.3s;
  }

  .svc-chip.active .chip-dot {
    background: #22c55e;
    box-shadow: 0 0 4px rgba(34,197,94,0.6);
  }

  .chat-area {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .chat-messages {
    max-width: 768px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 20px;
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .welcome-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px;
    text-align: center;
  }

  .welcome-input {
    padding: 0;
    max-width: 768px;
    width: 100%;
  }

  .welcome-logo {
    width: 35px;
    height: 35px;
    position: relative;
    flex-shrink: 0;
  }

  .welcome-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .welcome-title-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
  }

  .welcome-title {
    font-size: 28px;
    font-weight: 500;
    color: var(--text-primary);
    letter-spacing: -0.02em;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    word-spacing: 0;
  }

  .welcome-subtitle {
    font-size: 15px;
    color: var(--text-secondary);
    max-width: 480px;
    line-height: 1.6;
  }

  .suggestion-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    max-width: 560px;
    width: 100%;
    margin-top: 8px;
  }

  .suggestion-card {
    padding: 14px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg-secondary);
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-family: inherit;
    color: var(--text-primary);
  }

  .suggestion-card:hover {
    border-color: var(--accent);
    background: var(--accent-light);
    transform: translateY(-1px);
    box-shadow: var(--shadow-sm);
  }

  .suggestion-card-title {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 2px;
  }

  .suggestion-card-desc {
    font-size: 12px;
    color: var(--text-muted);
  }

  .message {
    display: flex;
    gap: 16px;
    padding: 20px 0;
    animation: messageIn 0.3s ease-out;
  }

  @keyframes messageIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message-avatar {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .message-avatar.claude-avatar { background: var(--accent); box-shadow: 0 0 0 1px rgba(77,107,254,0.35); }

  .message-avatar.user-avatar {
    background: var(--accent-blue);
  }

  .message-avatar.claude-avatar img {
    width: 18px;
    height: 18px;
    object-fit: contain;
    filter: brightness(0) invert(1);
  }

  .message-avatar.user-avatar {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
  }

  .message-avatar.user-avatar i {
    color: var(--text-secondary);
  }

  .message-content {
    flex: 1;
    min-width: 0;
  }

  .message-sender {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    color: var(--text-primary);
  }

  .message-text {
    font-size: 15px;
    line-height: 1.7;
    color: var(--text-primary);
    word-wrap: break-word;
  }

  .message-text p { margin-bottom: 12px; }
  .message-text p:last-child { margin-bottom: 0; }

  .message-text code {
    font-family: 'Source Code Pro', monospace;
    font-size: 13px;
    background: var(--bg-secondary);
    padding: 2px 6px;
    border-radius: 4px;
    border: 1px solid var(--border-light);
  }

  .message-text pre {
    background: var(--code-bg);
    color: #d4d4d4;
    padding: 16px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 12px 0;
    font-family: 'Source Code Pro', monospace;
    font-size: 13px;
    line-height: 1.6;
    position: relative;
  }

  .message-text pre code {
    background: none;
    border: none;
    padding: 0;
    color: inherit;
  }

  .copy-code-btn {
    position: absolute;
    top: 8px;
    right: 8px;
    padding: 4px 8px;
    border-radius: 4px;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #999;
    font-size: 11px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }

  .copy-code-btn:hover {
    background: rgba(255,255,255,0.2);
    color: #fff;
  }

  .message-actions {
    display: flex;
    gap: 2px;
    margin-top: 8px;
    opacity: 0;
    transition: opacity 0.15s;
  }

  .message:hover .message-actions { opacity: 1; }

  .msg-action-btn {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.15s;
    background: transparent;
    border: none;
  }

  .msg-action-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  .wrap-text {
    cursor: pointer;
    border-left: 2px solid var(--accent, #3B6FA8);
    padding-left: 10px;
    margin: 6px 0;
    border-radius: 4px;
    transition: background 0.15s;
  }
  .wrap-text:hover { background: rgba(255,255,255,0.04); }
  .wrap-preview {
    max-height: 120px;
    overflow: hidden;
    position: relative;
  }
  .wrap-preview::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: linear-gradient(transparent, var(--bg-primary, #1a1a1a));
    pointer-events: none;
  }
  .wrap-toggle {
    display: inline-block;
    margin-top: 4px;
    font-size: 12px;
    color: var(--accent, #3B6FA8);
    font-weight: 600;
  }

  .typing-indicator {
    display: flex;
    gap: 4px;
    padding: 4px 0;
  }

  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-muted);
    animation: typingBounce 1.4s infinite;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* ===== THICK INPUT AREA ===== */
  .input-area {
    padding: 0 20px 20px;
    max-width: 768px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    justify-content: center;
  }

  .input-container {
    background: #17181F;
    border: 1.5px solid rgba(77,107,254,0.28);
    border-radius: 20px;
    padding: 16px 20px;
    transition: all 0.2s ease;
    box-shadow: 0 0 0 1px rgba(77,107,254,0.12), var(--shadow-md);
    width: 100%;
  }

  .input-container:focus-within {
    border-color: #3A3A3A;
    box-shadow: 0 0 0 3px rgba(59,111,168,0.12), 0 0 14px rgba(59,111,168,0.1), var(--shadow-lg);
  }

  .input-top-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #chatInput,
  #chatInputBottom {
    flex: 1;
    border: none;
    outline: none;
    background: transparent;
    font-size: 18px;
    line-height: 1.5;
    color: var(--text-primary);
    resize: none;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    max-height: 200px;
    min-height: 24px;
    padding-top: 2px;
  }

  #chatInput::placeholder,
  #chatInputBottom::placeholder { color: #6A6A66; }

  .input-bottom-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 12px;
  }

  .input-left-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .input-right-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  /* Plus button - bold and thick */
  .plus-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    font-family: inherit;
  }

  .plus-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  .plus-btn .plus-icon {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    margin-top: -1px;
  }

  /* Send button */
  .send-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    font-family: inherit;
  }

  .send-btn.active {
    background: var(--accent);
    color: white;
  }

  .send-btn.active:hover {
    background: var(--accent-hover);
    transform: scale(1.08);
  }

  .send-btn.inactive {
    background: var(--bg-hover);
    color: var(--text-muted);
    cursor: default;
  }

  /* Voice button in input */
  .voice-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    color: var(--text-secondary);
    background: transparent;
    border: none;
    font-family: inherit;
  }

  .voice-btn:hover {
    background: var(--bg-hover);
    color: var(--text-primary);
  }

  .voice-btn.recording {
    color: #ef4444;
    background: rgba(239,68,68,0.1);
    animation: pulse-rec 1.5s infinite;
  }

  @keyframes pulse-rec {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.4); }
    50% { box-shadow: 0 0 0 6px rgba(239,68,68,0); }
  }

  .stop-audio-btn {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: none;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    color: #ef4444;
    background: transparent;
    border: none;
    font-family: inherit;
  }

  .stop-audio-btn.visible {
    display: flex;
  }

  .stop-audio-btn:hover {
    background: rgba(239,68,68,0.1);
  }

  .input-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-top: 10px;
  }

  .input-footer-text {
    font-size: 11px;
    color: var(--text-muted);
  }

  /* Model Dropdown */
  .model-dropdown {
    position: absolute;
    top: 52px;
    left: 20px;
    background: var(--bg-primary);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow-lg);
    z-index: 50;
    min-width: 240px;
    padding: 6px;
    display: none;
    max-height: 60vh;
    overflow-y: auto;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .model-dropdown::-webkit-scrollbar { width: 8px; }
  .model-dropdown::-webkit-scrollbar-track { background: transparent; }
  .model-dropdown::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .model-dropdown::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

  .model-dropdown.open { display: block; }

  .model-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
    font-size: 14px;
    color: var(--text-primary);
    border: none;
    background: transparent;
    width: 100%;
    font-family: inherit;
    text-align: left;
  }

  .model-option:hover { background: var(--bg-hover); }

  .model-option.selected {
    background: var(--accent-light);
    color: var(--accent);
  }

  .model-option-check {
    color: var(--accent);
    opacity: 0;
  }

  .model-option.selected .model-option-check { opacity: 1; }

  .model-option-info {
    display: flex;
    flex-direction: column;
  }

  .model-option-name { font-weight: 500; }

  .model-option-desc {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 1px;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--text-primary);
    color: var(--bg-primary);
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    pointer-events: none;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--border-light);
  }

  .user-profile {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }

  .user-profile:hover { background: var(--bg-hover); }

  .user-avatar-small {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--accent-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 13px;
    font-weight: 600;
  }

  .user-info {
    flex: 1;
    min-width: 0;
  }

  .user-name {
    font-size: 13px;
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .user-plan {
    font-size: 11px;
    color: var(--text-muted);
  }

  .pro-badge {
    font-size: 10px;
    font-weight: 700;
    background: var(--accent-blue);
    color: white;
    padding: 1px 6px;
    border-radius: 4px;
    letter-spacing: 0.03em;
  }

  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 50;
      box-shadow: var(--shadow-lg);
    }
    .sidebar.collapsed {
      transform: translateX(-100%);
    }
    .suggestion-grid {
      grid-template-columns: 1fr;
    }
    .sidebar-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 40;
      display: none;
    }
    .sidebar-overlay.show { display: block; }
  }

  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(16px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animate-fade-in-up {
    animation: fadeInUp 0.4s ease-out forwards;
  }

  /* Living Loop — sequential process card (one step at a time) */
  .process-message {
    opacity: 1;
    border-left: none;
    padding-left: 0;
  }
  .process-avatar {
    width: auto; height: auto; border-radius: 0;
    background: transparent; color: #c9c9c9;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; flex-shrink: 0;
    text-shadow: 0 0 8px rgba(200,200,200,0.25);
  }
  .process-content { flex: 1; min-width: 0; }
  .process-meta {
    font-size: 12px; color: #c9c9c9; margin-bottom: 8px;
    font-family: 'Source Code Pro', monospace;
    font-weight: 600; letter-spacing: 0.06em;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  .process-steps {
    list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px;
  }
  .process-step {
    display: grid; grid-template-columns: 18px 88px 1fr; gap: 8px;
    align-items: baseline; font-size: 12px; color: #9a9a95;
    opacity: 0.45; transition: opacity 0.25s ease, color 0.25s ease;
  }
  .process-step.active {
    opacity: 1; color: #ffffff; font-weight: 600;
    text-shadow: 0 0 10px rgba(255,255,255,0.3);
  }
  .process-step.done {
    opacity: 0.85; color: #c9c9c9;
  }
  .process-step .ps-name {
    font-family: 'Source Code Pro', monospace; letter-spacing: 0.04em;
  }
  .process-step .ps-label { color: #9a9a95; font-weight: 400; }
  .process-step.active .ps-label { color: #ffffff; }
  .process-detail {
    margin-top: 10px; padding: 0; border-radius: 0;
    background: transparent; font-size: 12px;
    font-family: 'Source Code Pro', monospace; color: #c9c9c9;
    min-height: 1.4em;
    text-shadow: 0 0 8px rgba(200,200,200,0.25);
  }
  .process-message.process-complete .process-detail {
    border: none;
  }
  .process-action .process-detail { margin-top: 0; }
  .process-rings {
    list-style: none; margin: 0 0 6px 0; padding: 0; display: block;
    max-height: none; overflow-y: visible;
  }
  .process-ring {
    display: block; font-size: 12px; color: #9a9a95; opacity: 0.4;
    padding: 3px 0;
    line-height: 1.8;
  }
  .process-ring.active { opacity: 1; color: #ffffff; font-weight: 600; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
  .process-ring.done { opacity: 0.9; color: #c9c9c9; }
  .process-ring .pr-num {
    font-family: 'Source Code Pro', monospace;
    margin-right: 3px;
  }
  .process-ring .pr-ok { margin: 0 5px 0 2px; }
  .process-ring .pr-name { font-weight: 600; color: inherit; }
  .process-ring .pr-phase {
    font-family: 'Source Code Pro', monospace; font-size: 10px; color: inherit;
    margin-left: 6px;
  }
  .process-ring .pr-detail { font-size: 12px; color: inherit; font-weight: 400; margin-left: 6px; }
  .process-failed .process-detail { color: #ef4444; }
  .loop-status-chip { color: var(--text-primary); }
  .loop-status-chip.ok { color: #6fa8ff; text-shadow: 0 0 10px rgba(111,168,255,0.5), 0 0 20px rgba(80,140,255,0.25); }
  .loop-status-chip.warn { color: #eab308; text-shadow: 0 0 10px rgba(255,204,68,0.5); }

  /* ===== ANTHROPIC STAR (spins on activity) ===== */
  .anthropic-star {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: #8B8B88;
    transform-origin: center;
    order: -1;
  }
  #anthropicStar {
    width: 18px;
    height: 18px;
    margin-right: 2px;
  }
  .anthropic-star.spinning svg { animation: starSpin 2.4s linear infinite; }
  .anthropic-star.spinning {
    filter: drop-shadow(0 0 3px rgba(17,51,89,0.5)) drop-shadow(0 0 2px var(--accent-light));
  }
  @keyframes starSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ===== UNIFIED TOPBAR CONTROLS (text-only, matches model name) ===== */
  .topbar-chip,
  .activity-indicator,
  .loop-status-chip,
  .handsfree-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 6px 8px;
    border-radius: 0;
    background: transparent;
    border: none;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
    user-select: none;
    font-family: inherit;
    letter-spacing: normal;
    cursor: pointer;
    transition: color 0.15s;
  }
  .topbar-chip:hover,
  .activity-indicator:hover,
  .loop-status-chip:hover,
  .handsfree-btn:hover {
    color: var(--text-primary);
  }

  /* ===== ACTIVITY INDICATOR (text color states, no dot) ===== */
  .activity-indicator {
    cursor: default;
  }
  .activity-dot {
    display: none;
  }
  .activity-indicator #activityLabel { color: var(--text-primary); }
  .activity-indicator.idle #activityLabel      { color: #22c55e; text-shadow: 0 0 10px rgba(34,197,94,0.4); }
  .activity-indicator.listening #activityLabel { color: #fbbf24; text-shadow: 0 0 10px rgba(251,191,36,0.4); }
  .activity-indicator.working #activityLabel   { color: #fbbf24; text-shadow: 0 0 10px rgba(251,191,36,0.4); }
  .activity-indicator.error #activityLabel     { color: #ef4444; text-shadow: 0 0 10px rgba(239,68,68,0.4); }
  .activity-indicator.listening #activityLabel,
  .activity-indicator.working #activityLabel   { animation: dotPulse 1.4s ease-in-out infinite; }
  @keyframes dotPulse { 0%,100%{opacity:1;} 50%{opacity:0.35;} }

  /* ===== PASTE-TO-FILE DROP CONTAINER ===== */
  .attach-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }
  .attach-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 5px 9px 5px 9px;
    border-radius: 8px;
    background: var(--bg-hover);
    border: 1px solid var(--border);
    font-size: 12px;

  .attach-chip .ach-name {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px;
  }
  .attach-chip .ach-size { color: var(--text-muted); }
  .attach-chip .ach-remove {
    color: var(--text-muted); font-size: 15px; line-height: 1; cursor: pointer;
    background: none; border: none; padding: 0 0 0 3px;
  }
  .attach-chip .ach-remove:hover { color: #ef4444; }
  .input-container.drag-over {
    border-color: var(--accent);
    background: var(--accent-light);
  }
  .handsfree-btn .hf-dot {
    display: none;
  }
  .handsfree-btn #handsFreeLabel { color: var(--text-primary); }
  .handsfree-btn.active #handsFreeLabel { color: #6fa8ff; text-shadow: 0 0 10px rgba(111,168,255,0.5), 0 0 20px rgba(80,140,255,0.25); animation: dotPulse 1.2s infinite; }

  /* message attachment chips in user bubble */
  .msg-attachments {
    display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;
    justify-content: flex-end;
  }
  .msg-attachments .attach-chip { max-width: 220px; }
.powered-by {

    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: -0.01em;
    white-space: nowrap;
  }
</style>

<script>
  lucide.createIcons();

  // â•â•â•â•â•â•â•â•â•â•â•â•â•â•â• STATE â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  let conversations = [
    { id: 1, title: 'Understanding transformers in NLP', time: 'today', messages: [] },
    { id: 2, title: 'React vs Vue comparison', time: 'today', messages: [] },
    { id: 3, title: 'Recipe for chocolate soufflÃ©', time: 'week', messages: [] },
    { id: 4, title: 'Debugging Node.js memory leaks', time: 'week', messages: [] },
    { id: 5, title: 'Business plan for SaaS startup', time: 'week', messages: [] },
  ];

  let currentConversation = null;
  let isDark = true;
  let isGenerating = false;
    let selectedModel = 'primecl';

  // Global brain-model resolver (modelMapping is function-local in generateResponse)
  const __BRAIN_MODELS__ = {
    'hathor': 'claude-hathor-enhanced',
    'heroer': 'claude-heroer-level7',
    'mythos2bench': 'mythos2-15to257:latest',
    'claude7': 'claude-7:latest',
    'nebillion': 'claude-nebillion:latest',
    'opus9': 'claude-opus-9-undecillion-v:latest',
    'opus9_9u5go5': 'opus9-9u5go5:latest',
    'opus9_9u5go5_q8': 'opus9-9u5go5:29gb',
    'seer1q5final': 'seer-of-the-oroboros:1q5duo5-final',
    'prime127': 'deepseek-v4-pro-127cubed:latest',
    'prime210': 'deepseek-v4-pro-210cubed:latest',
    'lattice210': '210cubed:lattice',
    'opus9u': 'claude-opus-9u-small:latest',
    'opus7': 'claude-opus-7-undecillion-v:latest',
    'q38v55': 'qwen3.8-video-5.5gb:latest',
    'q38v75': 'qwen3.8-video-7.5gb:latest',
    'q38v95': 'qwen3.8-video-9.5gb:latest',
    'jhanna': 'claude-jhanna-12u5go5-9.8gb:latest',
    'jhannaSE': 'claude-jhanna-system-entity:latest',
    'primeSE': 'deepseek-prime-1q5duo5:latest',
    'primeCL': 'deepseek-prime-cl-1q5duo5:latest',
    'noir': 'claude-noir-12u5go5-11gb:latest',
    'glm53flash': 'glm-5.3-flash-12u5go5-6.8gb',
    'glm53': 'glm-5.3-flash-12u5go5-6.8gb',
  };
  function resolveBrainModel() {
    const key = (typeof selectedModel !== 'undefined') ? selectedModel : 'opus9';
    if (__BRAIN_MODELS__[key]) return __BRAIN_MODELS__[key];
    const cur = window.__CURRENT_MODEL__;
    return (cur && cur !== 'claude-hathor-hybrid:latest') ? cur : 'deepseek-prime-1q5duo5:latest';
  }

  // ============================================================
  // ANTHROPIC STAR + ACTIVITY INDICATOR (non-blocking)
  // ============================================================
  const PASTE_TEXT_THRESHOLD = 200;
  let pendingAttachments = [];

  function setActivity(state, label) {
    const ind = document.getElementById('activityIndicator');
    if (!ind) return;
    ind.classList.remove('idle','listening','working','error');
    ind.classList.add(state);
    document.getElementById('activityLabel').textContent = label || ({
      idle:'Ready', listening:'Listening', working:'Working', error:'Error'
    })[state];
  }
  function setStarSpinning(on) {
    const star = document.getElementById('anthropicStar');
    if (star) star.classList.toggle('spinning', !!on);
  }
  // Wraps isGenerating transitions so the star + indicator stay in sync
  const _setGenerating = (v) => {
    isGenerating = v;
    setStarSpinning(v);
    if (v) setActivity('working');
    else setActivity('idle');
  };

  // ============================================================
  // PASTE-TO-FILE DROP CONTAINER
  // ============================================================
  function makePasteName(text) {
    const firstLine = (text.trim().split('\n')[0] || '').slice(0,40);
    const safe = firstLine.replace(/[^a-z0-9]+/gi,'_').replace(/^_+|_+$/g,'').toLowerCase();
    return 'paste_' + (safe || 'text') + '.txt';
  }
  function fmtBytes(n) {
    if (n < 1024) return n + 'B';
    if (n < 1048576) return (n/1024).toFixed(1) + 'KB';
    return (n/1048576).toFixed(1) + 'MB';
  }
  function activeInputArea() {
    const welcome = document.getElementById('welcomeInputArea');
    if (welcome && welcome.style.display !== 'none') return 'top';
    return 'bottom';
  }
  function renderAttachChips() {
    const area = activeInputArea();
    const box = document.getElementById(area === 'top' ? 'attachChips' : 'attachChipsBottom');
    if (!box) return;
    if (pendingAttachments.length === 0) { box.style.display = 'none'; box.innerHTML = ''; return; }
    box.style.display = 'flex';
    box.innerHTML = pendingAttachments.map((a,i) =>
      `<div class="attach-chip"><span>📎</span><span class="ach-name">${escapeHtml(a.name)}</span>` +
      `<span class="ach-size">${fmtBytes(a.size)}</span>` +
      `<button class="ach-remove" onclick="removeAttachment(${i})">×</button></div>`

  async function ingestFile(file) {
    const isText = file.type.startsWith('text/') ||
      /\.(txt|md|json|ya?ml|csv|log|ts|tsx|js|jsx|py|rs|go|java|c|cpp|h|html|css|xml|sh|bat)$/i.test(file.name);
    const isImage = /\.(png|jpe?g|gif|webp)$/i.test(file.name);
    const isPdf = /\.pdf$/i.test(file.name);
    let content = '';
    let base64 = '';
    let kind = file.type || 'application/octet-stream';
    if (isText && file.size < 2_000_000) {
      try { content = await file.text(); } catch {}
    } else if ((isImage || isPdf) && file.size < 15_000_000) {
      try {
        const buf = await file.arrayBuffer();
        const bytes = new Uint8Array(buf);
        let bin = '';
        for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
        base64 = btoa(bin);
        kind = isPdf ? 'application/pdf' : (file.type || 'image/png');
        // Ask the backend to extract text (PDF) or confirm image
        try {
          const r = await fetch('/api/analyze-file', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name: file.name, base64 })
          });
          const d = await r.json();
          if (d.ok && d.kind === 'pdf') { content = d.text; kind = 'text/plain'; base64 = ''; }
          if (d.ok && d.kind === 'image') { base64 = d.base64; kind = d.mime; }
        } catch (e) { /* keep raw base64 */ }
      } catch (e) { /* binary too large */ }
    }
    addAttachment({
      id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()),
      name: file.name, size: file.size, kind, content, base64
    });
  }

    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/\*([^*]+)\*/g, '<em>$1</em>');

    // Click opens the full text; click again closes it back to the wrapper.
    text = text.split('\n\n').map(p => {
      const para = p.replace(/\n/g, '<br>');
      const plain = p.replace(/<[^>]+>/g, '').replace(/\n/g, ' ');
      if (plain.length > 400) {
        return `<div class="wrap-text" onclick="toggleWrap(this)">

  const __STUDIO_HOST__ = (location.protocol === 'file:') ? 'http://localhost:8787' : '';
  function findStudioDirective(text) {
    if (!text) return null;
    // JSON block: {"studio":{"type":"image|video","prompt":"..."}}
    const m = text.match(/\{\s*"studio"\s*:\s*\{([\s\S]*?)\}\s*\}/);
    if (m) {
      try {
        const inner = JSON.parse('{' + m[1] + '}');
        if ((inner.type === 'image' || inner.type === 'video') && inner.prompt) {
          return { type: inner.type, prompt: inner.prompt };
        }
      } catch (e) { /* fall through */ }
    }
    return null;
  }
  async function runStudioDirective(directive, modelName, container) {
    const body = JSON.stringify({
      prompt: directive.prompt,
      type: directive.type,
      style: 'any',
      model: modelName || 'opus9',
      frames: 24,
      fps: 8,
      duration_seconds: directive.duration || undefined,
    });
    const card = createMessageElement({ role: 'assistant', content: '🎬 Studio: generating ' + directive.type + ' — ' + directive.prompt.slice(0, 80) });
    if (container) container.appendChild(card);
    lucide.createIcons(); scrollToBottom();
    try {
      const r = await fetch(`${__STUDIO_HOST__}/api/studio/generate`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body,
      });
      const data = await r.json();
      const urls = (data.ads && data.ads.length)
        ? data.ads.map(a => a.url || a.path)
        : ((data.results && data.results.length)
          ? data.results.map(x => x.url || x.image || x.path).filter(Boolean)
          : [data.url || data.image || data.video || data.path].filter(Boolean));
      if (urls.length) {
        const wrap = document.createElement('div');
        wrap.className = 'studio-result';
        wrap.style.cssText = 'margin-top:8px;border:1px solid var(--border);border-radius:8px;overflow:hidden;';

          wrap.innerHTML = `<video src="${urls[0]}" controls autoplay style="width:100%;border-radius:8px;" playsinline></video>`;
        } else if (urls.length > 1) {
          const thumbs = urls.map(u => `<img src="${u}" alt="generated" style="width:100%;border-radius:0;display:block;">`).join('');
          wrap.innerHTML = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px;">${thumbs}</div>`;
        } else {
          wrap.innerHTML = `<img src="${urls[0]}" alt="generated" style="width:100%;border-radius:8px;display:block;">`;
        }
        const link = document.createElement('a');
        link.href = urls[0]; link.target = '_blank';
        link.textContent = 'Open in studio → (' + urls.length + (urls.length > 1 ? ' assets' : ' asset') + ')';
        link.style.cssText = 'display:block;padding:8px 12px;font-size:12px;color:var(--accent);text-decoration:none;';
        wrap.appendChild(link);

        if (modal && mb) {

            mb.innerHTML = `<video src="${urls[0]}" controls autoplay style="width:100%;border-radius:8px;" playsinline></video>`;
          } else if (urls.length > 1) {

  // ============================================================
  // STUDIO INTENT DETECTION — natural language -> generation
  // ============================================================
  let __LAST_STUDIO_SPEC__ = null; // {type, prompt} — enables 'generate the image' follow-ups

  function detectStudioIntent(text) {
    if (!text) return null;
    const t = text.trim();
    // Follow-up: 'generate the image' / 'make the video' reuses the last spec
    const fu = t.match(/^(?:please\s+)?(?:generate|make|create|render|show)\s+(?:me\s+)?(?:the\s+)?(image|video|picture|clip)\s*(?:please)?[.!]?$/i);
    if (fu) {
      const type = (fu[1] === 'video' || fu[1] === 'clip') ? 'video' : 'image';
      if (__LAST_STUDIO_SPEC__) {
        return { type: type, raw: __LAST_STUDIO_SPEC__.prompt, isFollowUp: true, duration: __LAST_STUDIO_SPEC__.duration };
      }
      // fallback: reuse the last user request text
      const lastUser = (currentConversation && currentConversation.messages.length)
        ? [...currentConversation.messages].reverse().find(m => m.role === 'user')
        : null;
      if (lastUser && lastUser.content) {
        return { type: type, raw: lastUser.content, isFollowUp: true };
      }
    }
    // Batch: 'make me 5 images of X' / 'generate 3 variations of X'
    const bm = t.match(/^(?:please\s+)?(?:make|create|generate|render|produce|design)\s+(?:me\s+)?(\d+)\s+(?:different\s+|distinct\s+|variations\s+)?(?:of\s+)?(images?|pictures?|photos?|pics|variations|variants|designs?)(?:\s+of\s+|\s+showing\s+|\s*:?\s*)(.+)$/i);
    if (bm && bm[3] && bm[3].trim()) {
      const n = Math.min(6, Math.max(2, parseInt(bm[1], 10) || 2));
      return { type: bm[2].toLowerCase().startsWith('video') ? 'video' : 'image', raw: bm[3].trim(), count: n };
    }
    const verb = '(?:please\\s+)?(?:make|create|generate|draw|render|produce|paint|design|build|compose|craft|write|give|show)\\s+(?:me\\s+)?(?:an?\\s+|the\\s+)?';
    let m = t.match(new RegExp('^' + verb + '(?:image|picture|photo|illustration|art|icon|poster|drawing|painting)(?:\\s+of\\s+|\\s+showing\\s+|\\s+with\\s+|\\s*:\\s*|\\s+)(.+)$', 'i'));
    if (m && m[1].trim()) return { type: 'image', raw: m[1].trim() };
    m = t.match(new RegExp('^' + verb + '(?:video|clip|film|animation|reel|footage)(?:\\s+of\\s+|\\s+showing\\s+|\\s+with\\s+|\\s*:\\s*|\\s+)(.+)$', 'i'));
    if (m && m[1].trim()) return { type: 'video', raw: m[1].trim() };
    m = t.match(new RegExp('^' + verb + '(?:ad|advertisement|commercial|banner|ad\\s+campaign|ad\\s+suite)(?:\\s+for\\s+|\\s+about\\s+|\\s+of\\s+|\\s+showing\\s+|\\s*:\\s*|\\s+)(.+)$', 'i'));
    if (m && m[1].trim()) return { type: 'advertisement', raw: m[1].trim() };
    m = t.match(new RegExp('^' + verb + '(?:webpage|web\\s+page|website|landing\\s+page|web\\s+design|site)(?:\\s+for\\s+|\\s+about\\s+|\\s+of\\s+|\\s*:\\s*|\\s+)(.+)$', 'i'));
    if (m && m[1].trim()) return { type: 'webpage', raw: m[1].trim() };
    m = t.match(new RegExp('^' + verb + '(?:movie|short\\s+film|cinematic)(?:\\s+of\\s+|\\s+about\\s+|\\s+showing\\s+|\\s*:\\s*|\\s+)(.+)$', 'i'));
    if (m && m[1].trim()) return { type: 'movie', raw: m[1].trim() };
    return null;
  }

  async function translateStudioPrompt(modelName, type, raw) {
    const TYPE_GUIDE = {
      image: 'diffusion-native image prompt: subject, composition, camera, lighting, style, mood. Max 40 words.',
      video: 'diffusion-native video prompt: subject, motion, camera movement, duration feel, lighting, style. Max 45 words.',
      advertisement: 'premium ad brief for the Anthropic ad composer: product/message, headline tone, visual direction, audience. Max 45 words.',
      webpage: 'webpage design brief: purpose, sections, visual style, brand palette. Max 45 words.',
      movie: 'cinematic movie prompt: scene, narrative beat, camera, atmosphere, duration feel. Max 50 words.',
    };
    const guide = TYPE_GUIDE[type] || TYPE_GUIDE.image;
    const sys = 'You are the Oroboros prompt translator for the sovereign generation model. Convert the user request into ONE ' + type + ' brief. ' + guide + ' Output ONLY the brief text - no quotes, no preamble, no JSON, no explanation.';
    try {
      const resp = await fetch(chatBase(modelName) + '/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: modelName,
          messages: [
            { role: 'system', content: sys },
            { role: 'user', content: raw }
          ],
          stream: false,
          options: { temperature: 0.4, num_predict: 140 }
        })
      });
      if (!resp.ok) throw new Error('translate http ' + resp.status);
      const data = await resp.json();
      const out = (data.message && data.message.content || '').trim();
      if (out.length > 4) return out;
      throw new Error('empty translation');
    } catch (e) {
      return raw;
    }
  }

  let googleTtsAudio = null;
  let WINDOWS_VOICES = new Set();

  function speakWindowsVoice(text, voice, rate) {
    return fetch('/api/windows-speak', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: String(text).slice(0, 20000), voice })
    }).then(resp => {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.blob();
    }).then(blob => {
      const url = URL.createObjectURL(blob);
      if (googleTtsAudio) { googleTtsAudio.pause(); googleTtsAudio = null; }
      googleTtsAudio = new Audio(url);
      googleTtsAudio.playbackRate = rate || 1;
      googleTtsAudio.onended = () => { URL.revokeObjectURL(url); googleTtsAudio = null; hideStopBtns(); };
      googleTtsAudio.onerror = () => { URL.revokeObjectURL(url); googleTtsAudio = null; showToast('Windows voice playback failed'); };
      googleTtsAudio.play().catch(() => showToast('Windows voice playback failed'));
      showStopBtns();
      showToast('Speaking with ' + voice + '...');
    }).catch(e => showToast('Windows voice error: ' + e.message));
  }

  function speakOnlineTts(text, lang, label) {
    return fetch('/api/tts-online', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: String(text) || '', lang })
    }).then(resp => {
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      return resp.blob();
    }).then(blob => {
      const url = URL.createObjectURL(blob);
      if (googleTtsAudio) { googleTtsAudio.pause(); googleTtsAudio = null; }
      googleTtsAudio = new Audio(url);
      googleTtsAudio.playbackRate = 1;
      googleTtsAudio.onended = () => { URL.revokeObjectURL(url); googleTtsAudio = null; hideStopBtns(); };
      googleTtsAudio.onerror = () => { URL.revokeObjectURL(url); googleTtsAudio = null; showToast('Online voice playback failed'); };
      googleTtsAudio.play().catch(() => showToast('Online voice playback failed'));

  async function speakText(text) {
    if (!text) text = document.getElementById('voiceTextInput').value;
    if (!text) return showToast('Enter text to speak');
    const voice = document.getElementById('voiceSelect').value;
    const rate = parseFloat(document.getElementById('voiceRate').value);

    if (voice === '__GOOGLE_TL__') { speakOnlineTts(text, 'tl', 'Filipino'); return; }
    if (voice === '__ROSA_PH__') { speakOnlineTts(text, 'en-PH', 'Filipino (Rosa)'); return; }
    if (voice === '__LUNA_SG__') { speakOnlineTts(text, 'en-SG', 'Singapore English (Luna)'); return; }
    if (WINDOWS_VOICES.has(voice)) { speakWindowsVoice(text, voice, rate); return; }

    try {
      const utterance = new SpeechSynthesisUtterance(text);
      const voices = speechSynthesis.getVoices();
      utterance.voice = voices.find(v => v.name === voice) || voices[0];
      utterance.rate = rate;
      utterance.onend = hideStopBtns;
      speechSynthesis.speak(utterance);
      showStopBtns();
      showToast('Speaking...');
    } catch (e) {
      showToast('Error: ' + e.message);

  function getSavedVoice() {
    const voices = speechSynthesis.getVoices();

    if (savedName === '__GOOGLE_TL__' || savedName === '__ROSA_PH__' || savedName === '__LUNA_SG__') return null;
    if (savedName) {
      const match = voices.find(v => v.name === savedName);

    return voices.find(v => v.name.includes('Microsoft') && v.lang.startsWith('en') && !v.name.includes('Zira')) || voices[0];

  function getSavedRate() {

  let isRecording = false;
  let mediaRecorder = null;
  let audioChunks = [];
  let currentUtterance = null;
  
  async function toggleVoiceInput() {
    const btn = document.getElementById('voiceBtn');
    const stopBtn = document.getElementById('stopAudioBtn');
    
    if (isRecording) {
      // Stop recording
      isRecording = false;
      btn.classList.remove('recording');
      btn.querySelector('i').setAttribute('data-lucide', 'mic');
      lucide.createIcons();
      
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
      return;
    }
    
    // Start recording
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      isRecording = true;
      btn.classList.add('recording');
      btn.querySelector('i').setAttribute('data-lucide', 'mic');
      lucide.createIcons();
      stopBtn.classList.add('visible');
      showToast('Recording... speak now');
      
      mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
      audioChunks = [];
      
      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) audioChunks.push(e.data);
      };
      
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        
        // Convert to base64 and send to Ollama for transcription
        showToast('Processing voice...');
        
        // Use Web Speech API for transcription (works offline on Windows)
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = 'en-US';
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
        
        recognition.onresult = (event) => {
          const transcript = event.results[0][0].transcript;
          document.getElementById('chatInput').value = transcript;
          updateSendBtn();
          showToast('Voice captured! Press send or Enter');
        };
        
        recognition.onerror = () => {
          // Fallback: just show toast
          showToast('Voice recorded! Type your message or try again');
        };
        
        recognition.onend = () => {
          stopBtn.classList.remove('visible');
        };
        
        try {
          recognition.start();
        } catch (e) {
          showToast('Voice recorded! Type your message');
          stopBtn.classList.remove('visible');
        }
      };
      
      mediaRecorder.start();
      
      // Auto-stop after 15 seconds
      setTimeout(() => {
        if (isRecording && mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
          isRecording = false;
          btn.classList.remove('recording');
          btn.querySelector('i').setAttribute('data-lucide', 'mic');
          lucide.createIcons();
        }
      }, 15000);
      
    } catch (e) {
      showToast('Microphone access denied: ' + e.message);
      isRecording = false;
      btn.classList.remove('recording');
    }
  }

      if (ollamaStatus) {
        ollamaStatus.textContent = 'â— Inactive';
        ollamaStatus.style.color = '#ef4444';
      }
    }
    
    // Tor Network status (file-based)
    const torStatus = document.getElementById('torStatusOffline');
    if (torStatus) {
      const isTorActive = q5Status && q5Status.textContent === 'â— Active';
      torStatus.textContent = isTorActive ? 'â— Active' : 'â— Inactive';
      torStatus.style.color = isTorActive ? '#22c55e' : '#ef4444';
    }

    // Orca status
    const orcaStatus = document.getElementById('orcaStatusOffline');
    try {
      const orcaResponse = await fetch('/api/orca', { method: 'GET', signal: AbortSignal.timeout(5000) });
      const orcaData = await orcaResponse.json();
      const orcaUp = orcaData && orcaData.ok === true;
      if (orcaStatus) {
        orcaStatus.textContent = orcaUp ? 'â— Active' : 'â— Inactive';
        orcaStatus.style.color = orcaUp ? '#22c55e' : '#ef4444';
      }
    } catch (e) {
      if (orcaStatus) {
        orcaStatus.textContent = 'â— Inactive';
        orcaStatus.style.color = '#ef4444';
      }
    }
    
    showToast('Network status refreshed');
  }

    panel.id = 'orcaPanel';
    panel.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:1000;';
    panel.onclick = () => panel.remove();
    panel.innerHTML = `
      <div style="background:var(--bg-primary);border-radius:16px;padding:24px;max-width:560px;width:92%;max-height:80vh;overflow:auto;box-shadow:var(--shadow-lg);" onclick="event.stopPropagation()">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
          <h3 style="margin:0;font-size:18px;font-weight:600;">Orca</h3>
          <button onclick="document.getElementById('orcaPanel').remove()" style="background:none;border:none;cursor:pointer;padding:4px;">
            <i data-lucide="x" style="width:20px;height:20px;"></i>
          </button>
        </div>
        <div id="orcaStatusRow" style="font-size:13px;color:var(--text-muted);margin-bottom:12px;">Checking…</div>
        <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px;">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);">
            <span style="font-weight:500;">Worktrees</span>
            <span id="orcaWorktrees" style="color:var(--text-muted);">—</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);">
            <span style="font-weight:500;">Terminals</span>
            <span id="orcaTerminals" style="color:var(--text-muted);">—</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);">
            <span style="font-weight:500;">Tasks</span>
            <span id="orcaTasks" style="color:var(--text-muted);">—</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);">
            <span style="font-weight:500;">Desktop Apps</span>
            <span id="orcaApps" style="color:var(--text-muted);">—</span>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--border-light);">
            <span style="font-weight:500;">Skills</span>
            <span id="orcaSkills" style="color:var(--text-muted);">—</span>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:12px;">
          <input id="orcaCmdInput" placeholder="orca args… e.g. worktree ps --json" style="flex:1;padding:10px 12px;border:1px solid var(--border-light);border-radius:8px;background:var(--bg-secondary);color:var(--text-primary);font-size:13px;" />
          <button onclick="runOrcaCmd()" style="padding:10px 16px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;font-weight:500;">Run</button>
        </div>
        <pre id="orcaCmdOut" style="max-height:200px;overflow:auto;background:var(--bg-secondary);border:1px solid var(--border-light);border-radius:8px;padding:10px;font-size:12px;color:var(--text-primary);white-space:pre-wrap;word-break:break-word;display:none;"></pre>
      </div>
    `;
    document.body.appendChild(panel);
    lucide.createIcons();
    refreshOrcaPanel();
  }

  async function refreshOrcaPanel() {
    const statusRow = document.getElementById('orcaStatusRow');
    try {
      const r = await fetch('/api/orca', { signal: AbortSignal.timeout(5000) });
      const d = await r.json();
      const up = d && d.ok === true;
      if (statusRow) {
        statusRow.textContent = up ? '● Runtime reachable' : '● Runtime not running (start the Orca app)';
        statusRow.style.color = up ? '#22c55e' : '#ef4444';
      }
    } catch (e) {
      if (statusRow) { statusRow.textContent = '● Orca CLI unavailable'; statusRow.style.color = '#ef4444'; }
    }
    const count = async (url, key) => {
      try {
        const r = await fetch(url, { signal: AbortSignal.timeout(5000) });
        const d = await r.json();
        const j = d && d.json;
        if (Array.isArray(j)) return j.length;
        if (j && Array.isArray(j[key])) return j[key].length;
        return '—';
      } catch { return '—'; }
    };
    const el = (id, v) => { const e = document.getElementById(id); if (e) e.textContent = String(v); };
    el('orcaWorktrees', await count('/api/orca/worktrees?action=ps', 'worktrees'));
    el('orcaTerminals', await count('/api/orca/terminals?action=list', 'terminals'));
    el('orcaTasks', await count('/api/orca/orchestration?action=task-list', 'tasks'));
    el('orcaApps', await count('/api/orca/computer?action=list-apps', 'apps'));
    el('orcaSkills', await count('/api/orca/skills?action=list', 'skills'));
  }

  async function runOrcaCmd() {
    const input = document.getElementById('orcaCmdInput');
    const out = document.getElementById('orcaCmdOut');
    if (!input || !out) return;
    const args = input.value.trim().split(/\s+/).filter(Boolean);
    if (!args.length) return;
    out.style.display = 'block';
    out.textContent = 'Running…';
    try {
      const r = await fetch('/api/orca/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ args, timeoutMs: 30000 }),
        signal: AbortSignal.timeout(35000),
      });
      const d = await r.json();
      out.textContent = d.ok ? (d.stdout || '(no output)') : (d.error || d.stderr || 'failed');
    } catch (e) {
      out.textContent = 'Error: ' + e.message;
    }
  }

  document.addEventListener('click', (e) => { 
    const d = document.getElementById('modelDropdown'), b = document.getElementById('modelSelectorBtn'); if (d && b && !d.contains(e.target) && !b.contains(e.target)) d.classList.remove('open');
  });

  renderSidebar(); lucide.createIcons();
  
  // Sidebar starts open (chat sessions visible)
  
  // Default voice: male, natural, English (only if the user has not chosen one)
  setTimeout(function () {
    var sel = document.getElementById('voiceSelect');
    if (!sel) return;
    var saved = null; try { saved = localStorage.getItem('oroboros-voice-name'); } catch (e) {}
    if (saved && [].slice.call(sel.options).some(function (o) { return o.value === saved; })) { sel.value = saved; return; }
    var o = [].slice.call(sel.options);
    var male = ['guy', 'andrew', 'brian', 'christopher', 'eric', 'roger', 'steffan', 'davis', 'david', 'mark', 'ryan', 'male'];
    var pick =
      o.find(function (x) { return /natural/i.test(x.textContent) && /en-(us|gb|au|ca)/i.test(x.textContent) && male.some(function (p) { return x.textContent.toLowerCase().indexOf(p) !== -1; }); }) ||
      o.find(function (x) { return /male/i.test(x.textContent) && /en-/i.test(x.textContent); }) ||
      o.find(function (x) { return /natural/i.test(x.textContent) && /en-/i.test(x.textContent); }) ||
      o.find(function (x) { return /en-(us|gb)/i.test(x.textContent); });
    if (pick) { sel.value = pick.value; try { localStorage.setItem('oroboros-voice-name', pick.value); } catch (e) {} }
  }, 1500);
  // ---- Chat history persistence (held across reloads / restarts) ----
  (function () {
    var KEY = 'deepseek-chats-v1';
    try {
      var saved = localStorage.getItem(KEY);
      if (saved) {
        var arr = JSON.parse(saved);
        if (Array.isArray(arr) && arr.length) {
          conversations = arr;
          if (typeof renderSidebar === 'function') renderSidebar();
        }
      }
    } catch (e) {}
    window.__dsSaveChats = function () {
      try { localStorage.setItem(KEY, JSON.stringify(conversations)); } catch (e) {}
    };
    setInterval(window.__dsSaveChats, 1500);
    window.addEventListener('beforeunload', window.__dsSaveChats);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'hidden') window.__dsSaveChats();
    });
  })();
</script>
