<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=https://deepseek-research-chat.vercel.app/">
  <link rel="preconnect" href="https://deepseek-research-chat.vercel.app">
  <title>DeepSeek Research Console</title>
  <style>
    :root{color-scheme:dark;--bg:#07101f;--panel:#101d33;--text:#eef5ff;--muted:#9fb0c8;--blue:#2f6bff;--cyan:#12c8ff;--line:rgba(145,180,255,.22)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#07101f,#0a172a);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    main{width:min(720px,calc(100% - 36px));border:1px solid var(--line);border-radius:8px;padding:34px;background:rgba(255,255,255,.045);box-shadow:0 24px 70px rgba(0,0,0,.25)}
    .eyebrow{color:var(--cyan);font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:12px}
    h1{margin:14px 0 12px;font-size:54px;line-height:.98;letter-spacing:0}
    p{color:var(--muted);line-height:1.6;font-size:18px}
    a{display:inline-block;margin-top:20px;border:1px solid rgba(18,200,255,.45);border-radius:8px;padding:12px 16px;color:var(--text);text-decoration:none;font-weight:800;background:linear-gradient(135deg,rgba(47,107,255,.9),rgba(18,200,255,.72))}
    @media(max-width:720px){h1{font-size:38px}}
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Research Console</div>
    <h1>Opening Console</h1>
    <p>The chat portal is loading now.</p>
    <a href="https://deepseek-research-chat.vercel.app/">Open Console</a>
  </main>
</body>
</html>
